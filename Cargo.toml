[workspace]
members = [
    "crates/domain",
    "crates/persistence",
    "crates/compiler",
    "crates/hardware",
    "crates/platform",
    "crates/runtime",
    "crates/ui",
    "crates/app",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["KojiroXor"]
license = "MIT OR Apache-2.0"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
thiserror = "2.0"
anyhow = "1.0"
tokio = { version = "1.43", features = ["full"] }
tracing = "0.1"
tracing-subscriber = "0.3"
crossbeam-channel = "0.5"
sha2 = "0.10"
uuid = { version = "1.12", features = ["v4", "serde"] }
dirs = "6.0"

# Windows native
windows = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dwm",
    "Win32_System_Threading",
    "Win32_System_ProcessStatus",
    "Win32_System_LibraryLoader",
    "Win32_System_DataExchange",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell",
] }

# Linux native
x11rb = { version = "0.13", features = ["all-extensions"] }

# GUI
egui = "0.30"
eframe = "0.30"

# Local workspace crates
ch57x-domain = { path = "crates/domain" }
ch57x-persistence = { path = "crates/persistence" }
ch57x-compiler = { path = "crates/compiler" }
ch57x-hardware = { path = "crates/hardware" }
ch57x-platform = { path = "crates/platform" }
ch57x-runtime = { path = "crates/runtime" }
ch57x-ui = { path = "crates/ui" }
